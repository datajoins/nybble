[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datajoins-nybble"
version = "1.0.7"
description = "A nybble is 4 bits. That's all you need. Browse, query, diagram, and graph any data source - one pip install, zero infrastructure."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "DataJoins", email = "hello@datajoins.com" }]
keywords = [
    "data", "sql", "erd", "knowledge-graph", "duckdb", "etl",
    "schema-inference", "data-exploration", "data-catalog",
    "graphml", "json-ld", "parquet", "graph", "visualization",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Operating System :: OS Independent",
]

dependencies = [
    "duckdb>=0.10",
    "polars>=0.20",
    "networkx>=3.0",
    "rich>=13.0",
    "click>=8.1",
    "requests>=2.31",
    "jinja2>=3.1",
    "pyvis>=0.3",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "pygments>=2.17",
    "pyyaml>=6.0",
    "sqlglot>=20.0",
]

[project.optional-dependencies]
# ── Relational databases ──────────────────────────────────────────────────────
postgres  = ["psycopg2-binary", "connectorx>=0.3,<0.4"]
mysql     = ["pymysql"]
mssql     = ["pyodbc"]
oracle    = ["oracledb"]
# ── NoSQL / document stores ───────────────────────────────────────────────────
mongo     = ["pymongo"]
redis     = ["redis"]
cassandra = ["cassandra-driver"]
elastic   = ["elasticsearch"]
# ── Streaming / messaging ─────────────────────────────────────────────────────
kafka     = ["confluent-kafka"]
# ── Cloud data warehouses (DynamoDB via boto3) ─────────────────────────────
dynamo    = ["boto3"]
# ── Optional features ─────────────────────────────────────────────────────────
textual   = ["textual>=0.50"]
kuzu      = ["kuzu>=0.3"]
rdf       = ["rdflib>=6.0"]
mcp       = ["mcp>=1.0,<2.0"]
semantic  = ["sentence-transformers>=2.0"]
serve     = ["waitress>=2.1", "flask>=3.0"]
dev       = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "flask>=3.0",
]
all       = [
    "psycopg2-binary",
    "connectorx>=0.3,<0.4",
    "pymysql",
    "mcp>=1.0,<2.0",
    "rdflib>=6.0",
    "waitress>=2.1",
]

[project.urls]
Homepage        = "https://datajoins.com"
Repository      = "https://github.com/datajoins/nybble"
Documentation   = "https://nybble.datajoins.com/documentation.html"
Changelog       = "https://github.com/datajoins/nybble/blob/main/CHANGELOG.md"
"Bug Tracker"   = "https://github.com/datajoins/nybble/issues"
Contributing    = "https://github.com/datajoins/nybble/blob/main/CONTRIBUTING.md"

[project.scripts]
nybble     = "nybble.cli:cli"
nybble-mcp = "nybble.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nybble*", "server*"]
exclude = ["tests*", "docs*", "deploy*"]

[tool.setuptools.package-data]
"nybble" = ["templates/*.jinja"]
"nybble.core" = ["*.py"]
"server.app" = ["templates/*.html", "static/**/*"]

[tool.ruff]
# Pin ruff's rule set so new ruff releases don't silently add checks.
# Matches the subset checked in CI (E + F only - style and pyflakes errors).
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Enforce only a curated subset of E/F rules - enough to catch real bugs
# without failing on the many pre-existing cosmetic patterns in the codebase.
# S (bandit), BLE (blind exceptions), I (isort) etc. are intentionally excluded.
select = ["E", "F"]
ignore = [
    "E401",   # multiple imports on one line - used throughout nybble/
    "E402",   # module-level import not at top - intentional in some modules
    "E501",   # line too long - not enforced; formatter handles this
    "E702",   # multiple statements on one line (semicolon) - used in nybble/
    "E712",   # comparison to True/False - intentional in tests
    "F401",   # unused import - noisy in __init__ re-exports; per-file below
    "F541",   # f-string without placeholders - pre-existing in nybble/
    "F841",   # local variable assigned but never used - pre-existing
]

[tool.ruff.lint.per-file-ignores]
# Test files: allow unused imports (fixtures re-exported), broad excepts in
# teardown fixtures, and flexible local import ordering inside test methods.
"tests/*.py" = ["F401", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::pluggy.PluggyTeardownRaisedWarning",
]
