# .github/workflows/ci.yml - Nybble CI
#
# Runs on every push and pull request to main/develop.
# Jobs:
#   test  - pytest for the nybble package, across Python 3.10-3.12
#   lint  - ruff style/import check over nybble/ and tests/
#   build - sdist + wheel build verification with twine check

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Package tests ─────────────────────────────────────────────────────────────
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=nybble --cov-report=term-missing

  # ── Package lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint - nybble package (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.8"

      - name: Lint nybble package and tests
        run: ruff check nybble/ tests/

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Build (sdist + wheel)
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: twine check dist/*
