# .github/workflows/docker-publish.yml - Nybble Docker Hub Publish
#
# Triggers on any tag matching v* (e.g. v1.0.0, v1.2.3).
# Pushes to datajoins/nybble on Docker Hub with both versioned and 'latest' tags.
#
# Required GitHub Actions secrets (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  - your Docker Hub username (the datajoins org admin)
#   DOCKERHUB_TOKEN     - a Docker Hub Access Token (not your password)
#                         Create at: hub.docker.com → Account Settings → Security
#
# Images pushed:
#   datajoins/nybble:latest
#   datajoins/nybble:1.0.0   (semver, no 'v' prefix)
#   datajoins/nybble:1.0     (minor version alias)
#   datajoins/nybble:1       (major version alias)

name: Publish Docker Image

on:
  push:
    tags:
      - "v*"

jobs:
  docker-build-push:
    name: Build and push Docker image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: datajoins/nybble
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          # NOTE: Dockerfile lives at deploy/Dockerfile, not the repo root.
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache - speeds up subsequent builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max
