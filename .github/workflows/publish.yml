# .github/workflows/publish.yml - Nybble PyPI Publish
#
# Triggers on any tag matching v* (e.g. v1.0.0, v1.2.3).
# Uses PyPI Trusted Publishing (OIDC) - no API token secret required.
#
# One-time setup on pypi.org:
#   Project → Publishing → Add a new trusted publisher
#     GitHub owner:   datajoins
#     Repository:     nybble
#     Workflow name:  publish.yml
#     Environment:    pypi
#
# Then tag a release:
#   git tag v1.0.0 && git push origin v1.0.0

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # The 'pypi' environment must be created in GitHub repo Settings → Environments
    # and matched to the trusted publisher entry on pypi.org.
    environment: pypi

    permissions:
      id-token: write   # required for OIDC Trusted Publishing

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No 'with: password:' - OIDC Trusted Publishing handles auth automatically.
        # If you must use an API token instead, add:
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}
