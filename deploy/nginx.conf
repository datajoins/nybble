server {
    listen       80;
    server_name  _;

    # ── Query editor - COEP header for DuckDB-WASM ───────────────────────────────
    # COEP credentialless allows DuckDB-WASM to run without requiring every
    # subresource to carry a CORP header.  We intentionally do NOT set
    # Cross-Origin-Opener-Policy here: COOP same-origin isolates the page into
    # a separate browsing context group which causes Chrome to refuse same-origin
    # iframe navigations (the lineage ERD pane), producing ERR_CONNECTION_REFUSED.
    # Without COOP the page is not cross-origin isolated, so SharedArrayBuffer
    # is unavailable - but DuckDB-WASM falls back to single-threaded mode silently.
    location ~ ^/query/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-store";
    }

    # ── ERD viewer - allow embedding inside the COEP-isolated /query/ page ──────
    # The /query/ page is served with Cross-Origin-Embedder-Policy: require-corp.
    # That policy blocks any iframe or subresource that doesn't declare a
    # Cross-Origin-Resource-Policy header. Adding "same-origin" here lets the
    # browser load /erd/ inside the lineage iframe on the query page.
    location ~ ^/erd/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store";
    }

    # All other requests proxy to the Flask app.
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Allow large file uploads
        client_max_body_size 500m;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;

        # No caching for dynamic content
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
